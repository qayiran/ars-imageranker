name: Verify showcase site
on:
  push:
    paths: ['assets/**', 'server/**', 'scripts/**', 'tests/**', 'showcase/**', 'index.html', 'gallery.html', 'results.html', 'character.html', 'config.json', 'package.json', '.github/workflows/check.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - run: npm run build
